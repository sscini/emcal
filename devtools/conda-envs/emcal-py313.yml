# emcal on Python 3.13 with both GP backends (gpflow, gpytorch). Validated on Windows 11.
#
#   conda env create -f devtools/conda-envs/emcal-py313.yml
#   conda activate emcal-py313-fromrepo      # activate so ipopt is on PATH
#   pip install -e . --no-deps
#   pytest -v
#
# Notes:
#   * Python packages come from pip only, to avoid conda/pip numpy conflicts.
#   * gpflow 2.9.2 is the newest that installs on 3.13 (2.10+ needs numpy<2) and needs setuptools<81.
#   * Windows: TFP has paths over 260 chars, so keep the env at a short prefix.
#   * Tasmanian (method C2) has no wheel; its tests are skipped.
#   * test_end_to_end's golden value is from TF 2.15/macOS and fails on this stack.
#   * Full lock: emcal-py313-pip-freeze.txt.
#   * macOS on Apple silicon: use emcal-py313-mac.yml instead (gpflow needs a workaround).
name: emcal-py313-fromrepo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - ipopt=3.14       # Müller case studies (CS2/CS3)
  - pip:
      # core
      - numpy==2.5.4
      - scipy==1.18.1
      - pandas==3.0.6
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      # GP backend: gpflow
      - gpflow==2.9.2
      - tensorflow==2.21.0
      - tensorflow-probability==0.25.0
      - tf-keras==2.21.0
      - setuptools<81
      # GP backend: gpytorch
      - torch==2.14.1    # CPU wheel; see pytorch.org for CUDA
      - gpytorch==1.15.2
      - linear-operator==0.6.1
      # optional extras
      - pyomo==6.10.1    # Müller case studies
      - signac==2.4.1    # signac job analysis
      # REM Surface Evolver work (emcal_se in ReverseEngineeringMorphogenesis)
      - spatial-efd==1.2.1
      - similaritymeasures==1.5.0
      - openpyxl==3.1.5
      # testing
      - pytest==9.1.1
      - pytest-cov==7.1.0
